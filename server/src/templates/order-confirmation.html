<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<meta
			http-equiv="X-UA-Compatible"
			content="IE=edge"
		/>
		<style>
			@media (prefers-color-scheme: dark) {
				.logo-dark { display: inline !important; }
				.logo-light { display: none !important; }
			}
		</style>
	</head>
	<body
		style="
			margin: 0;
			padding: 0;
			background-color: #ffffff;
			font-family: 'Georgia, sans-serif;
		"
	>
		<!-- Outer background wrapper (Protonmail / client compat) -->
		<table
			width="100%"
			cellpadding="0"
			cellspacing="0"
			border="0"
			bgcolor="#ffffff"
		>
			<tr>
				<td
					bgcolor="#ffffff"
					align="center"
					style="padding: 32px 16px"
				>
					<!-- Inner container -->
					<table
						cellpadding="0"
						cellspacing="0"
						border="0"
						style="width: 100%"
					>
						<!-- Logo -->
						<tr>
							<td
								align="center"
								style="padding-bottom: 16px"
							>
								<img
									class="logo-light"
									src="https://dev.cdn.heirloom.shop/logo.png"
									style="width: 200px"
								/>
								<img
									class="logo-dark"
									src="https://dev.cdn.heirloom.shop/logo-white.png"
									style="width: 200px; display: none"
								/>
							</td>
						</tr>

						<!-- Thank you heading -->
						<tr>
							<td
								align="center"
								style="padding-bottom: 24px"
							>
								<p
									style="
										margin: 0;
										font-family:
											'Alegreya Sans', Arial,
											sans-serif;
										font-size: 24px;
										font-weight: 500;
										color: #1a1a1a;
										line-height: 1.4;
									"
								>
									Thank you for your order.
								</p>
							</td>
						</tr>

						<!-- Body text -->
						<tr>
							<td align="center">
								<p
									style="
										margin: 0 0 12px 0;
										font-family:
											'Alegreya Sans', Arial,
											sans-serif;
										font-size: 18px;
										font-weight: 400;
										color: #444444;
										line-height: 1.6;
									"
								>
									You will receive an email when
									each item in your order has
									shipped.
								</p>
								<p
									style="
										margin: 0;
										font-family:
											'Alegreya Sans', Arial,
											sans-serif;
										font-size: 18px;
										font-weight: 400;
										color: #444444;
										line-height: 1.6;
									"
								>
									Reply to this email with any
									questions or concerns.
								</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
